<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unfluffify Console</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      .toolbar { padding: 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
      .list { padding: 8px; display: grid; gap: 6px; }
      .item { border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .item strong { margin-right: 6px; }
      .source { display: inline-flex; margin-right: 6px; padding: 1px 5px; border-radius: 999px; background: #eef3ff; color: #274c86; font: 700 10px/1.4 system-ui, sans-serif; text-transform: uppercase; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>Unfluffify console stream</strong>
      <button id="clear" type="button">Clear</button>
    </div>
    <div id="list" class="list"></div>
    <script type="module" src="./remote-console.js"></script>
  </body>
</html>

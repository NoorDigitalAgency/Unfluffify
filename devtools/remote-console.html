<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unfluffify Console</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color-scheme: light dark; }
      .toolbar { padding: 8px; border-bottom: 1px solid var(--toolbar-border, #ddd); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .toolbar__controls { display: flex; align-items: center; gap: 10px; }
      .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
      .toolbar select { font: inherit; }
      .list { padding: 8px; display: grid; gap: 6px; }
      .item { border: 1px solid var(--console-border, #d0d5dd); border-left-width: 4px; border-radius: 6px; padding: 6px 8px; background: var(--console-background, #ffffff); color: var(--console-text, #101828); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .item__header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .item__message { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
      .item strong { margin-right: 2px; color: var(--console-accent, #475467); }
      .item--log { --console-accent: #475467; --console-border: #d0d5dd; --console-background: #f8fafc; }
      .item--info { --console-accent: #155eef; --console-border: #84adff; --console-background: #eff4ff; }
      .item--warn { --console-accent: #b54708; --console-border: #fdb022; --console-background: #fffaeb; }
      .item--error { --console-accent: #d92d20; --console-border: #fda29b; --console-background: #fef3f2; }
      .item--debug { --console-accent: #7a5af8; --console-border: #bdb4fe; --console-background: #f4f3ff; }
      .source { display: inline-flex; margin-right: 6px; padding: 1px 5px; border-radius: 999px; background: var(--source-background, #eef3ff); color: var(--source-text, #274c86); font: 700 10px/1.4 system-ui, sans-serif; text-transform: uppercase; }
      .muted { color: var(--muted-text, #666); }

      @media (prefers-color-scheme: dark) {
        body { background: #1b1b1f; color: #e6e6ea; }
        .toolbar { --toolbar-border: #33343a; }
        .item { --console-text: #e6e6ea; }
        .item--log { --console-accent: #98a2b3; --console-border: #475467; --console-background: #1f2733; }
        .item--info { --console-accent: #84adff; --console-border: #2a4a82; --console-background: #16233b; }
        .item--warn { --console-accent: #fdb022; --console-border: #7a4d12; --console-background: #2e2410; }
        .item--error { --console-accent: #fda29b; --console-border: #7a2a25; --console-background: #2e1614; }
        .item--debug { --console-accent: #bdb4fe; --console-border: #4a3f8a; --console-background: #221f3a; }
        .source { --source-background: #24344f; --source-text: #9db8e6; }
        .muted { --muted-text: #9a9aa2; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>Unfluffify console stream</strong>
      <div class="toolbar__controls">
        <label>Source <select id="source-filter"></select></label>
        <button id="clear" type="button">Clear</button>
      </div>
    </div>
    <div id="list" class="list"></div>
    <script type="module" src="./remote-console.js"></script>
  </body>
</html>

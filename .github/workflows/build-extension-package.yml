name: Build Extension Package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  release-extension:
    name: Create release package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Release tag ${tag} already exists. Bump package.json version before running this workflow again."
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists. Bump package.json version before running this workflow again."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Create deployment zip
        run: pnpm deploy:zip

      - name: Locate release artifacts
        id: artifacts
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          timestamped="$(find .output -maxdepth 1 -type f -name "Unfluffify-v${version}-[0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9].zip" | LC_ALL=C sort | tail -n 1)"
          latest=".output/Unfluffify-v${version}-latest.zip"

          if [ -z "${timestamped}" ] || [ ! -f "${timestamped}" ]; then
            echo "::error::pnpm deploy:zip did not create the timestamped Unfluffify-v${version}-<timestamp>.zip artifact."
            exit 1
          fi

          if [ ! -f "${latest}" ]; then
            echo "::error::pnpm deploy:zip did not create ${latest}."
            exit 1
          fi

          {
            echo "timestamped=${timestamped}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag release commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unfluffify ${{ steps.version.outputs.tag }}
          body: |
            Manual Unfluffify extension package release.

            Built from commit `${{ github.sha }}` using `pnpm deploy:zip`.
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.timestamped }}
            ${{ steps.artifacts.outputs.latest }}

      - name: Write workflow summary
        run: |
          {
            echo "## Extension Package Release"
            echo
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Tag: ${{ steps.version.outputs.tag }}"
            echo "- Timestamped artifact: ${{ steps.artifacts.outputs.timestamped }}"
            echo "- Latest artifact: ${{ steps.artifacts.outputs.latest }}"
          } >> "$GITHUB_STEP_SUMMARY"

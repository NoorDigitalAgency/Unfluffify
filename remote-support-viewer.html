<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Unfluffify Remote Support Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04080f;
      }

      body {
        position: relative;
        color: #c4d1e3;
        font: 500 16px/1.5 system-ui, sans-serif;
      }

      body[data-dock-state="floating_pip"] #viewer-sidecar {
        display: none;
      }

      #viewer-sidecar {
        position: absolute;
        left: 14px;
        bottom: 14px;
        width: 240px;
        display: grid;
        align-content: start;
        gap: 10px;
        z-index: 3;
        padding: 12px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(8, 13, 22, 0.78);
        backdrop-filter: blur(16px);
      }

      body[data-dock-state="embedded_minimized"] #viewer-sidecar,
      body[data-dock-state="fullscreen_active"] #viewer-sidecar {
        width: 188px;
        gap: 8px;
        padding: 10px;
      }

      .viewer-camera-slot {
        position: relative;
        width: 100%;
        height: 102px;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background:
          linear-gradient(180deg, rgba(23, 31, 46, 0.96), rgba(8, 13, 22, 0.98));
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
      }

      .viewer-camera-slot video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .viewer-camera-slot video[hidden] {
        display: none;
      }

      #viewer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .viewer-action {
        flex: 1 1 0;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(8, 13, 22, 0.72);
        color: #dbe8ff;
        font: 600 11px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .viewer-action.is-active {
        border-color: rgba(255, 153, 133, 0.52);
        background: rgba(143, 32, 22, 0.62);
        color: #fff1ed;
      }

      .viewer-action:focus-visible {
        outline: 2px solid rgba(108, 169, 255, 0.92);
        outline-offset: 2px;
      }

      #viewer-video,
      #viewer-placeholder {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #viewer-video {
        display: block;
        object-fit: contain;
        background: #04080f;
      }

      #viewer-video[hidden],
      #viewer-placeholder[hidden] {
        display: none;
      }

      #viewer-placeholder {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background:
          radial-gradient(circle at top, rgba(108, 169, 255, 0.18), transparent 36%),
          linear-gradient(180deg, rgba(7, 12, 20, 0.92), rgba(7, 12, 20, 0.98));
      }

      body[data-dock-state="embedded_minimized"] .viewer-camera-slot,
      body[data-dock-state="fullscreen_active"] .viewer-camera-slot {
        height: 72px;
      }
    </style>
  </head>
  <body>
    <video id="viewer-video" autoplay playsinline muted hidden></video>
    <audio id="remote-audio" autoplay></audio>
    <aside id="viewer-sidecar" aria-label="Remote support media">
      <div class="viewer-camera-slot">
        <video id="remote-camera-video" autoplay playsinline muted hidden></video>
      </div>
      <div class="viewer-camera-slot">
        <video id="local-camera-video" autoplay playsinline muted hidden></video>
      </div>
      <div id="viewer-actions">
        <button id="viewer-toggle-mute" class="viewer-action" type="button" aria-pressed="false">Mute</button>
        <button id="viewer-toggle-silent" class="viewer-action" type="button" aria-pressed="false">Silent</button>
        <button id="viewer-open-external" class="viewer-action" type="button">External</button>
        <button id="viewer-end-session" class="viewer-action is-active" type="button">Terminate</button>
      </div>
    </aside>
    <div id="viewer-placeholder">Waiting for the live remote surface...</div>
    <script type="module" src="remote-support-viewer.js"></script>
  </body>
</html>

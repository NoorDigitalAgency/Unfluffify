<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Unfluffify Remote Support Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04080f;
      }

      body {
        position: relative;
        color: #c4d1e3;
        font: 500 16px/1.5 system-ui, sans-serif;
      }

      #viewer-video,
      #viewer-placeholder {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #viewer-video {
        display: block;
        object-fit: contain;
        background: #04080f;
      }

      #viewer-video[hidden],
      #viewer-placeholder[hidden] {
        display: none;
      }

      #viewer-placeholder {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background:
          radial-gradient(circle at top, rgba(108, 169, 255, 0.18), transparent 36%),
          linear-gradient(180deg, rgba(7, 12, 20, 0.92), rgba(7, 12, 20, 0.98));
      }
    </style>
  </head>
  <body>
    <video id="viewer-video" autoplay playsinline muted hidden></video>
    <video id="sidebar-video" autoplay playsinline muted hidden></video>
    <canvas id="sidebar-canvas" hidden></canvas>
    <div id="viewer-placeholder">Waiting for the live remote surface...</div>
    <script type="module" src="remote-support-viewer.js"></script>
  </body>
</html>

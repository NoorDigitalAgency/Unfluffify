<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkContIt</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="title">MarkContIt</div>
        <div class="subtitle">Label meaningful text content</div>
      </header>

      <section class="card">
        <label class="row">
          <span>Enable on this tab</span>
          <input id="toggle-enabled" type="checkbox" />
        </label>
      </section>

      <section class="card">
        <label class="field">
          <span>Current Page URL</span>
          <div class="input-row">
            <div id="current-page-url" class="readout"></div>
            <button id="refresh-context" type="button">Refresh</button>
          </div>
        </label>
        <label class="field">
          <span>Base Page URL</span>
          <div class="input-row">
            <input id="base-url" type="text" placeholder="https://example.com" />
            <button id="base-url-set" type="button">Set</button>
            <button id="base-url-edit" type="button">Change</button>
          </div>
        </label>
        <div id="base-url-notice" class="notice" role="status" aria-live="polite">
          Set Base Page URL before enabling marking
        </div>
      </section>

      <div id="main-ui">
        <section class="card">
          <div class="section-title">Explicit excludes</div>
          <ul id="explicit-excludes" class="list"></ul>
        </section>

        <section class="card">
          <div class="section-title">Heading defaults</div>
          <ul id="heading-defaults" class="list"></ul>
        </section>

        <section class="card margin-above margin-below">
          <div class="padding-below section-title">Marked Pages</div>
          <ul id="marked-pages" class="list"></ul>
        </section>

        <section class="card">
          <div class="section-title">AI controls</div>
          <label class="field">
            <span>Endpoint URL</span>
            <div class="input-row">
              <input id="endpoint-url" type="text" placeholder="https://example.com" />
              <button id="endpoint-url-set" type="button">Set</button>
              <button id="endpoint-url-edit" type="button">Change</button>
            </div>
          </label>
          <div id="endpoint-notice" class="notice" role="status" aria-live="polite">
            Set Endpoint URL before using AI
          </div>
          <label id="ai-token" class="field">
            <span>Token</span>
            <div class="token-row">
              <span id="token-status" class="token-status"></span>
              <button id="token-action" type="button">Set token</button>
            </div>
          </label>
          <div id="ai-controls" class="border-above">
            <div class="section-title padding-above padding-below">
              Selector Computation
            </div>
            <button id="compute" class="full-width margin-above">
              Decide Content
            </button>
            <button id="save-excludes" class="full-width margin-above">
              Save Excludes
            </button>
          </div>
        </section>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>

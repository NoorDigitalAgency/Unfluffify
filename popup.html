<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unfluffify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="header-text">
          <img src="logo.png" alt="MarkContIt" class="header-logo" />
          <div class="subtitle">Tell AI what's not content</div>
        </div>
        <div class="header-actions">
          <button id="config-toggle" type="button" class="config-button" aria-haspopup="menu" aria-expanded="false">
            Configuration
          </button>
          <div id="config-menu" class="config-menu" role="menu" hidden>
            <button id="config-export-all" type="button" role="menuitem">Export all</button>
            <button id="config-export-current" type="button" role="menuitem">Export current</button>
            <div class="config-divider" role="separator"></div>
            <button id="config-import" type="button" role="menuitem">Import</button>
            <div class="config-divider" role="separator"></div>
            <button id="clear-domain-cache" type="button" role="menuitem" class="danger">
              Empty cache for current domain
            </button>
            <div class="config-divider" role="separator"></div>
            <button id="config-clear-current" type="button" role="menuitem" class="danger">
              Delete current Base Page URL configuration
            </button>
            <button id="config-clear-all" type="button" role="menuitem" class="danger">
              Delete all configuration
            </button>
          </div>
        </div>
      </header>

      <section class="card">
        <label class="row">
          <span>Enable on this tab</span>
          <input id="toggle-enabled" type="checkbox" />
        </label>
      </section>

      <section class="card">
        <div class="section-title">Device emulation</div>
        <label class="row">
          <span>Enable simulation</span>
          <input id="device-emulation-enabled" type="checkbox" />
        </label>
        <div class="radio-group" role="radiogroup" aria-label="Device emulation">
          <label class="row">
            <span>Desktop 1920x1080</span>
            <input id="device-mode-desktop" type="radio" name="device-mode" value="desktop" checked />
          </label>
          <label class="row">
            <span>Mobile 412x960</span>
            <input id="device-mode-mobile" type="radio" name="device-mode" value="mobile" />
          </label>
        </div>
        <div class="scale-control">
          <div class="row">
            <span>Scale</span>
            <span id="device-scale-value" class="scale-value">70%</span>
          </div>
          <input id="device-scale" type="range" min="0.25" max="1" step="0.05" value="0.7" />
        </div>
      </section>

      <section class="card">
        <label class="field">
          <span>Current Page URL</span>
          <div class="input-row">
            <div id="current-page-url" class="readout"></div>
            <button id="refresh-context" type="button">Refresh</button>
          </div>
        </label>
        <label class="field">
          <span>Base Page URL</span>
          <div class="input-row">
            <input id="base-url" type="text" placeholder="https://example.com" />
            <button id="base-url-set" type="button">Set</button>
            <button id="base-url-edit" type="button">Change</button>
          </div>
        </label>
        <div id="base-url-notice" class="notice" role="status" aria-live="polite">
          Set Base Page URL before enabling marking
        </div>
      </section>

      <div id="main-ui">
        <section class="card">
          <div class="section-title">Explicit excludes</div>
          <ul id="explicit-excludes" class="list"></ul>
        </section>

        <section class="card">
          <div class="section-title">Heading defaults</div>
          <ul id="heading-defaults" class="list"></ul>
        </section>

        <section class="card margin-above margin-below">
          <div class="padding-below section-title">Marked Pages</div>
          <ul id="marked-pages" class="list"></ul>
        </section>

        <section class="card">
          <div class="section-title">AI controls</div>
          <label class="field">
            <span>Endpoint URL</span>
            <div class="input-row">
              <input id="endpoint-url" type="text" placeholder="https://example.com" />
              <button id="endpoint-url-set" type="button">Set</button>
              <button id="endpoint-url-edit" type="button">Change</button>
            </div>
          </label>
          <div id="endpoint-notice" class="notice" role="status" aria-live="polite">
            Set Endpoint URL before using AI
          </div>
          <label id="ai-token" class="field">
            <span>Token</span>
            <div class="token-row">
              <span id="token-status" class="token-status"></span>
              <button id="token-action" type="button">Set token</button>
            </div>
          </label>
          <div id="ai-controls" class="border-above">
            <div class="section-title padding-above padding-below">
              Selector Computation
            </div>
            <button id="compute" class="full-width margin-above">
              Decide Content
            </button>
            <button id="save-excludes" class="full-width margin-above">
              Save Excludes
            </button>
            <button id="preview-latest" class="full-width margin-above">
              Preview Latest
            </button>
          </div>
        </section>

      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="ui-curtain" class="ui-curtain" role="status" aria-live="polite" hidden>
      <div class="ui-curtain__content">Please wait...</div>
    </div>
    <input id="config-import-file" type="file" accept="application/json" hidden />
    <script src="popup.js"></script>
  </body>
</html>
